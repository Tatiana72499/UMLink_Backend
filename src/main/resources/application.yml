spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: uml-collab-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/uml_collab}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
server:
  port: ${PORT:8080}
jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
