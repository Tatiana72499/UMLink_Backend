spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: uml-collab-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/uml_collab}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: ${PORT:8080}
  # Detrás de ALB/nginx: respeta X-Forwarded-Proto/Host.
  forward-headers-strategy: framework
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
app:
  cors:
    # Orígenes del frontend separados por coma (sin barra final). Ej: https://app.midominio.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://localhost:5173}
jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
